name: Build APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node --test tests/*.test.cjs
      - run: npm install
      - run: mkdir -p www && cp index.html privacy.html www/ && python3 prepare.py fonts
      - run: npx cap add android
      - run: pip install --break-system-packages pillow && python3 prepare.py android
      - run: npx cap sync android
      - run: python3 scripts/configure-release.py
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PawNote-unsigned-build-check
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PawNote.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Paw Note debug build ${{ github.run_number }}
          files: PawNote.apk
