name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: mkdir -p www && cp index.html www/index.html && python3 prepare.py fonts
      - run: npx cap add android
      - run: pip install --break-system-packages pillow && python3 prepare.py android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PawNote.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Paw Note build ${{ github.run_number }}
          files: PawNote.apk
