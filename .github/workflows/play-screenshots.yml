name: Capture Play Screenshots
on:
  workflow_dispatch:
  push:
    branches: [capture/play-screenshots]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41371956146 --name PawNote-signed-release --dir release
      - name: Verify release checksums
        run: sha256sum -c release/SHA256SUMS.txt
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r release/PawNote-release.apk
            python3 scripts/capture-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PawNote-Play-Screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
