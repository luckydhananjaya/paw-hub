<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paw Note</title>
  <style>
    @font-face {
      font-family: 'Caveat Brush';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/caveat-brush-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Itim';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/itim-latin-400-normal.woff2') format('woff2');
    }

    :root {
      --bg-cream: #FFF6E3;
      --ink: #1C1B1A;
      --yellow-action: #FFD84D;
      --dog-yellow: #FFF0B3;
      --bunny-pink: #FFD0DC;
      --dino-mint: #BCE8D3;
      --elephant-blue: #C9E9F8;
      --cat-orange: #FFE6A5;
      --border-thick: 2.5px solid var(--ink);
      --shadow-sticker: 0 3px 0 var(--ink);
      --shadow-sticker-sm: 0 2px 0 var(--ink);
      --shadow-sticker-lg: 0 4px 0 var(--ink);
      --font-title: 'Caveat Brush', 'Comic Sans MS', cursive, sans-serif;
      --font-body: 'Itim', -apple-system, BlinkMacSystemFont, 'Segoe UI', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: text;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* Outer phone container simulation if viewed on desktop */
    #app-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-cream);
      box-shadow: 0 0 20px rgba(0,0,0,0.06);
    }

    /* TOP HEADER */
    header {
      padding: 16px 16px 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background-color: var(--bg-cream);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .paw-logo {
      width: 26px;
      height: 26px;
      fill: var(--ink);
    }

    .brand h1 {
      font-family: var(--font-title);
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      color: var(--ink);
      transition: transform 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
      stroke: var(--ink);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* SEARCH BAR (EXPANDABLE) */
    .search-container {
      padding: 0 20px 10px 20px;
      display: none;
    }

    .search-container.active {
      display: block;
      animation: slideDown 0.2s ease;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border: var(--border-thick);
      border-radius: 16px;
      padding: 8px 14px;
      box-shadow: var(--shadow-sticker-sm);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--ink);
      background: transparent;
    }

    /* CATEGORY NAV ROW */
    .category-scroll {
      display: flex;
      gap: 10px;
      padding: 6px 20px 14px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: var(--border-thick);
      border-radius: 16px;
      box-shadow: var(--shadow-sticker-sm);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
      height: 48px;
    }

    .cat-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 var(--ink);
    }

    .cat-btn.text-pill {
      padding: 0 18px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: bold;
      background-color: #FFFFFF;
      color: var(--ink);
    }

    .cat-btn.text-pill.active {
      background-color: var(--ink);
      color: var(--bg-cream);
    }

    .cat-btn.icon-square {
      width: 48px;
      padding: 6px;
    }

    .cat-btn.icon-square.active {
      transform: translateY(-2px);
      box-shadow: 0 4px 0 var(--ink);
      border-width: 3px;
    }

    .cat-btn[data-animal="dog"] { background-color: var(--dog-yellow); }
    .cat-btn[data-animal="bunny"] { background-color: var(--bunny-pink); }
    .cat-btn[data-animal="dino"] { background-color: var(--dino-mint); }
    .cat-btn[data-animal="elephant"] { background-color: var(--elephant-blue); }
    .cat-btn[data-animal="cat"] { background-color: var(--cat-orange); }

    .cat-btn svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* NOTES GRID (MASONRY 2-COLUMN) */
    .notes-container {
      flex: 1;
      padding: 6px 14px 120px 14px;
      columns: 2;
      column-gap: 12px;
    }

    .note-card {
      break-inside: avoid;
      margin-bottom: 12px;
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: var(--shadow-sticker);
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background-color: var(--dog-yellow);
    }

    .note-card:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .note-card.color-dog { background-color: var(--dog-yellow); }
    .note-card.color-bunny { background-color: var(--bunny-pink); }
    .note-card.color-dino { background-color: var(--dino-mint); }
    .note-card.color-elephant { background-color: var(--elephant-blue); }
    .note-card.color-cat { background-color: #FFFFFF; }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .card-animal-badge {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .card-animal-badge svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 19px;
      line-height: 1.15;
      color: var(--ink);
      flex: 1;
      word-break: break-word;
    }

    /* CARD CONTENT */
    .card-body {
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.3;
      color: var(--ink);
    }

    .card-body p {
      margin-bottom: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* CHECKLIST IN CARD */
    .checklist-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      cursor: pointer;
    }

    .check-box {
      width: 17px;
      height: 17px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      background: transparent;
      transition: all 0.15s ease;
    }

    .check-item.done .check-box {
      background: var(--ink);
    }

    .check-box svg {
      width: 11px;
      height: 11px;
      stroke: var(--bg-cream);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: none;
    }

    .check-item.done .check-box svg {
      display: block;
    }

    .check-text {
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.25;
      color: var(--ink);
      transition: all 0.15s ease;
      word-break: break-word;
    }

    .check-item.done .check-text {
      text-decoration: line-through;
      opacity: 0.65;
    }

    /* SPECIAL CARD: DAMJAR / CAT POST-IT STYLE */
    .note-card.special-damjar {
      background-color: var(--cat-orange);
      padding: 10px;
      position: relative;
    }

    .special-damjar .damjar-inner {
      background: #FFFFFF;
      border: 2px solid var(--ink);
      border-radius: 14px;
      min-height: 80px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .special-damjar .damjar-corner-cat {
      width: 44px;
      height: 44px;
    }

    /* FLOATING ACTION BUTTON (FAB) */
    .fab-btn {
      position: fixed;
      bottom: 72px;
      right: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background-color: var(--yellow-action);
      border: var(--border-thick);
      box-shadow: var(--shadow-sticker-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    @media (min-width: 441px) {
      .fab-btn {
        right: calc(50% - 190px);
      }
    }

    .fab-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .fab-content {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .fab-plus {
      font-family: var(--font-title);
      font-size: 24px;
      font-weight: bold;
      color: var(--ink);
      line-height: 1;
    }

    .fab-paw {
      width: 18px;
      height: 18px;
      fill: var(--ink);
    }

    /* ADMOB BANNER AREA */
    .admob-reserved-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #FFFFFF;
      border-top: var(--border-thick);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      max-width: 440px;
      margin: 0 auto;
    }

    .admob-placeholder {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #7A7571;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .ad-badge {
      background: #EAE6DF;
      border: 1.5px solid #8E8A85;
      border-radius: 4px;
      font-size: 10px;
      padding: 1px 5px;
      color: var(--ink);
    }

    /* NOTE EDITOR MODAL SHEET */
    .editor-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 27, 26, 0.4);
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .editor-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .editor-sheet {
      width: 100%;
      max-width: 440px;
      height: 94vh;
      background-color: var(--dino-mint);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-left: var(--border-thick);
      border-right: var(--border-thick);
      border-top: var(--border-thick);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
      overflow: hidden;
      position: relative;
    }

    .editor-overlay.active .editor-sheet {
      transform: translateY(0);
    }

    /* EDITOR TOOLBAR */
    .editor-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(28, 27, 26, 0.1);
    }

    .editor-tools-left, .editor-tools-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .editor-tool-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      color: var(--ink);
      transition: transform 0.15s ease;
    }

    .editor-tool-btn:active {
      transform: scale(0.88);
    }

    .editor-tool-btn svg {
      width: 22px;
      height: 22px;
      stroke: var(--ink);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* THEME / ANIMAL SELECTOR BAR */
    .editor-theme-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.4);
      border-bottom: 2px solid rgba(28, 27, 26, 0.1);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .theme-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: var(--border-thick);
      box-shadow: var(--shadow-sticker-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .theme-dot.selected {
      transform: scale(1.15);
      border-width: 3px;
    }

    .theme-dot svg {
      width: 18px;
      height: 18px;
    }

    /* EDITOR CONTENT SCROLL */
    .editor-content-scroll {
      flex: 1;
      padding: 18px 22px;
      overflow-y: auto;
      position: relative;
    }

    .editor-top-area {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .editor-title-input {
      font-family: var(--font-title);
      font-size: 32px;
      color: var(--ink);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      line-height: 1.15;
    }

    .editor-title-input::placeholder {
      color: rgba(28, 27, 26, 0.35);
    }

    .editor-animal-mascot {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .editor-animal-mascot svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* NOTEBOOK RULED LINES & CHECKLIST */
    .editor-body-container {
      position: relative;
      min-height: 300px;
    }

    .editor-text-body {
      width: 100%;
      height: 100%;
      min-height: 280px;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 34px;
      color: var(--ink);
      resize: none;
      background-image: repeating-linear-gradient(to bottom, transparent, transparent 32px, rgba(28, 27, 26, 0.15) 33px, transparent 34px);
    }

    .editor-checklist-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .editor-check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
      border-bottom: 1.5px solid rgba(28, 27, 26, 0.12);
    }

    .editor-check-square {
      width: 22px;
      height: 22px;
      border: 2.2px solid var(--ink);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      cursor: pointer;
      flex-shrink: 0;
    }

    .editor-check-item.done .editor-check-square {
      background: var(--ink);
    }

    .editor-check-square svg {
      width: 14px;
      height: 14px;
      stroke: #FFFFFF;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: none;
    }

    .editor-check-item.done .editor-check-square svg {
      display: block;
    }

    .editor-check-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 18px;
      color: var(--ink);
    }

    .editor-check-item.done .editor-check-input {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .remove-check-btn {
      background: none;
      border: none;
      color: rgba(28, 27, 26, 0.4);
      font-size: 20px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .add-check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: rgba(28, 27, 26, 0.6);
      cursor: pointer;
      font-size: 16px;
    }

    .add-check-plus {
      width: 22px;
      height: 22px;
      border: 2px dashed var(--ink);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* SETTINGS MODAL */
    .settings-sheet {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-cream);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border: var(--border-thick);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      padding: 24px 20px 40px 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .editor-overlay.settings-active .settings-sheet {
      transform: translateY(0);
    }

    .settings-title {
      font-family: var(--font-title);
      font-size: 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-item {
      background: #FFFFFF;
      border: var(--border-thick);
      border-radius: 16px;
      box-shadow: var(--shadow-sticker-sm);
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-btn {
      width: 100%;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: bold;
      color: var(--ink);
      text-align: left;
    }

    /* EMPTY STATE */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .empty-mascot {
      width: 90px;
      height: 90px;
      margin-bottom: 16px;
      opacity: 0.8;
    }

    .empty-text {
      font-family: var(--font-title);
      font-size: 24px;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .empty-subtext {
      font-size: 15px;
      color: #7A7571;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- TOP HEADER -->
  <header>
    <div class="brand" onclick="filterCategory('all')">
      <!-- PAW ICON SVG -->
      <svg class="paw-logo" viewBox="0 0 64 64">
        <!-- Main pad -->
        <path d="M32 30 C20 30 16 42 20 54 C24 60 40 60 44 54 C48 42 44 30 32 30 Z" />
        <!-- Toe 1 -->
        <circle cx="14" cy="24" r="7" />
        <!-- Toe 2 -->
        <circle cx="26" cy="14" r="7.5" />
        <!-- Toe 3 -->
        <circle cx="38" cy="14" r="7.5" />
        <!-- Toe 4 -->
        <circle cx="50" cy="24" r="7" />
      </svg>
      <h1>Paw Note</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSearch()" title="Search notes">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
      </button>
      <button class="icon-btn" onclick="openSettings()" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <!-- EXPANDABLE SEARCH BAR -->

    },
    {
      id: "note-5",
      title: "Damjar",
      animal: "cat",
      color: "cat",
      type: "special-damjar",
      content: "",
      updatedAt: Date.now() - 1000 * 60 * 240
    },
    {
      id: "note-6",
      title: "Buy gifts",
      animal: "bunny",
      color: "bunny",
      type: "checklist",
      items: [
        { text: "Gift for Mom", done: true },
        { text: "Greeting card", done: false }
      ],
      updatedAt: Date.now() - 1000 * 60 * 300
    }
  ];

  // STATE MANAGEMENT
  let notes = [];
  let currentFilter = 'all';
  let searchQuery = '';
  let activeNote = null;
  let autoSaveTimeout = null;
  let dbInstance = null;

  // INDEXEDDB ENGINE
  const DB_NAME = 'PawNoteDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'notes';

  function openIndexedDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) {
        return reject(new Error('IndexedDB not supported'));
      }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          store.createIndex('updatedAt', 'updatedAt', { unique: false });
          store.createIndex('animal', 'animal', { unique: false });
          store.createIndex('pinned', 'pinned', { unique: false });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  async function idbGetAll() {
    if (!dbInstance) dbInstance = await openIndexedDB();
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbPut(note) {
    if (!dbInstance) dbInstance = await openIndexedDB();
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(note);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbDelete(id) {
    if (!dbInstance) dbInstance = await openIndexedDB();
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function idbBulkPut(notesList) {
    if (!dbInstance) dbInstance = await openIndexedDB();
    return new Promise((resolve, reject) => {
      const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      for (const item of notesList) {
        store.put(item);
      }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // INITIALIZE NOTES FROM INDEXEDDB (WITH LOCALSTORAGE FALLBACK)
  async function initNotes() {
    try {
      const loaded = await idbGetAll();
      if (loaded && loaded.length > 0) {
        notes = loaded;
      } else {
        // First launch: Seed initial sample notes
        notes = INITIAL_SAMPLE_NOTES;
        await idbBulkPut(notes);
      }
    } catch (err) {
      console.warn('IndexedDB unavailable, falling back to LocalStorage:', err);
      const saved = localStorage.getItem('paw_notes_data');
      if (saved) {
        try { notes = JSON.parse(saved); } catch (e) { notes = INITIAL_SAMPLE_NOTES; }
      } else {
        notes = INITIAL_SAMPLE_NOTES;
        localStorage.setItem('paw_notes_data', JSON.stringify(notes));
      }
    }
    sortNotes();
    renderNotes();
    initCapacitorAndAdMob();
  }

  function sortNotes() {
    notes.sort((a, b) => {
      const pinA = a.pinned ? 1 : 0;
      const pinB = b.pinned ? 1 : 0;
      if (pinA !== pinB) return pinB - pinA;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
  }

  async function saveNoteToStorage(note) {
    try {
      await idbPut(note);
    } catch (e) {
      // LocalStorage fallback
      localStorage.setItem('paw_notes_data', JSON.stringify(notes));
    }
  }

  async function deleteNoteFromStorage(id) {
    try {
      await idbDelete(id);
    } catch (e) {
      localStorage.setItem('paw_notes_data', JSON.stringify(notes));
    }
  }

  // RENDER NOTES GRID
  function renderNotes() {
    const grid = document.getElementById('notes-grid');
    const emptyState = document.getElementById('empty-state');
    
    let filtered = notes.filter(n => {
      const matchFilter = (currentFilter === 'all') || (n.animal === currentFilter);
      let matchSearch = true;
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        const inTitle = (n.title || '').toLowerCase().includes(q);
        let inContent = false;
        if (n.type === 'text') {
          inContent = (n.content || '').toLowerCase().includes(q);
        } else if (n.items) {
          inContent = n.items.some(item => (item.text || '').toLowerCase().includes(q));
        }
        matchSearch = inTitle || inContent;
      }
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '';
      emptyState.style.display = 'flex';
      return;
    }

    emptyState.style.display = 'none';

    grid.innerHTML = filtered.map(note => {
      const badgeSvg = ANIMAL_SVGS[note.animal] || ANIMAL_SVGS.dog;
      const pinBadge = note.pinned ? `<span style="font-size: 14px; margin-right: 4px;" title="Pinned">📌</span>` : '';
      
      if (note.type === 'special-damjar') {
        return `
          <div class="note-card special-damjar" onclick="openNote('${note.id}')">
            <div class="card-top">
              ${pinBadge}
              <span class="card-title">${escapeHtml(note.title || 'Note')}</span>
            </div>
            <div class="damjar-inner">
              <div class="damjar-corner-cat">${badgeSvg}</div>
            </div>
          </div>
        `;
      }

      let bodyHtml = '';
      if (note.type === 'checklist' && note.items) {
        bodyHtml = `
          <div class="checklist-list">
            ${note.items.slice(0, 5).map((item, idx) => `
              <div class="check-item ${item.done ? 'done' : ''}" onclick="toggleCardCheckItem(event, '${note.id}', ${idx})">
                <div class="check-box">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <span class="check-text">${escapeHtml(item.text)}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        bodyHtml = `
          <div class="card-body">
            <p>${escapeHtml(note.content || '')}</p>
          </div>
        `;
      }

      return `
        <div class="note-card color-${note.color || 'dog'}" onclick="openNote('${note.id}')">
          <div class="card-top">
            <div class="card-animal-badge">${badgeSvg}</div>
            <div class="card-title">${pinBadge}${escapeHtml(note.title || 'Untitled')}</div>
          </div>
          ${bodyHtml}
        </div>
      `;
    }).join('');
  }

  // CATEGORY FILTERING
  function filterCategory(cat) {
    currentFilter = cat;
    document.querySelectorAll('.cat-btn').forEach(btn => {
      if (btn.dataset.filter === cat) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    renderNotes();
  }

  // SEARCH HANDLING
  function toggleSearch() {
    const bar = document.getElementById('search-bar');
    bar.classList.toggle('active');
    if (bar.classList.contains('active')) {
      document.getElementById('search-input').focus();
    } else {
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderNotes();
    }
  }

  function handleSearch() {
    searchQuery = document.getElementById('search-input').value;
    renderNotes();
  }

  // TOGGLE CHECKBOX DIRECTLY ON CARD
  async function toggleCardCheckItem(event, noteId, itemIdx) {
    event.stopPropagation();
    const note = notes.find(n => n.id === noteId);
    if (note && note.items && note.items[itemIdx]) {
      note.items[itemIdx].done = !note.items[itemIdx].done;
      note.updatedAt = Date.now();
      await saveNoteToStorage(note);
      sortNotes();
      renderNotes();
    }
  }

  // NOTE EDITOR OPERATIONS
  function openNewNote() {
    activeNote = {
      id: 'note-' + Date.now(),
      title: '',
      animal: currentFilter !== 'all' ? currentFilter : 'dino',
      color: currentFilter !== 'all' ? currentFilter : 'dino',
      type: 'checklist',
      items: [{ text: '', done: false }],
      content: '',
      pinned: false,
      updatedAt: Date.now()
    };
    showEditor();
  }

  function openNote(noteId) {
    const found = notes.find(n => n.id === noteId);
    if (!found) return;
    activeNote = JSON.parse(JSON.stringify(found));
    showEditor();
  }

  function showEditor() {
    if (!activeNote) return;
    const overlay = document.getElementById('editor-overlay');
    
    // 1. Title
    document.getElementById('editor-title').value = activeNote.title || '';

    // 2. Content
    const isChecklist = activeNote.type === 'checklist';
    document.getElementById('editor-text').style.display = isChecklist ? 'none' : 'block';
    document.getElementById('editor-checklist').style.display = isChecklist ? 'block' : 'none';
    
    if (isChecklist) {
      renderEditorChecklist();
    } else {
      document.getElementById('editor-text').value = activeNote.content || '';
    }

    // 3. Animal & Color
    setEditorAnimal(activeNote.animal || 'dino', false);

    // 4. Pin status
    updateEditorPinUI();

    overlay.classList.add('active');
  }

  function updateEditorPinUI() {
    const btn = document.getElementById('pin-toggle-btn');
    if (btn) {
      if (activeNote && activeNote.pinned) {
        btn.style.opacity = '1';
        btn.style.color = '#E86C88';
      } else {
        btn.style.opacity = '0.6';
        btn.style.color = 'var(--ink)';
      }
    }
  }

  function togglePinCurrentNote() {
    if (!activeNote) return;
    activeNote.pinned = !activeNote.pinned;
    updateEditorPinUI();
    autoSaveNote();
  }

  function setEditorAnimal(animal, shouldAutosave = true) {
    if (!activeNote) return;
    activeNote.animal = animal;
    activeNote.color = animal;

    const colors = {
      dog: 'var(--dog-yellow)',
      bunny: 'var(--bunny-pink)',
      dino: 'var(--dino-mint)',
      elephant: 'var(--elephant-blue)',
      cat: 'var(--cat-orange)'
    };
    document.getElementById('editor-sheet').style.backgroundColor = colors[animal] || 'var(--dino-mint)';
    document.getElementById('editor-mascot').innerHTML = ANIMAL_SVGS[animal] || ANIMAL_SVGS.dino;

    document.querySelectorAll('.theme-dot').forEach(dot => {
      if (dot.dataset.color === animal) {
        dot.classList.add('selected');
      } else {
        dot.classList.remove('selected');
      }
    });
    if (shouldAutosave) {
      autoSaveNote();
    }
  }

  function toggleChecklistMode() {
    if (!activeNote) return;
    if (activeNote.type === 'checklist') {
      const text = (activeNote.items || []).map(i => i.text).join('\n');
      activeNote.content = text;
      activeNote.type = 'text';
      document.getElementById('editor-text').value = text;
      document.getElementById('editor-text').style.display = 'block';
      document.getElementById('editor-checklist').style.display = 'none';
    } else {
      const lines = (document.getElementById('editor-text').value || '').split('\n').filter(l => l.trim().length > 0);
      activeNote.items = lines.map(line => {
        let done = false;
        let text = line;
        if (line.startsWith('[x] ') || line.startsWith('[X] ')) {
          done = true; text = line.slice(4);
        } else if (line.startsWith('[ ] ')) {
          text = line.slice(4);
        } else if (line.startsWith('• ') || line.startsWith('- ')) {
          text = line.slice(2);
        }
        return { text, done };
      });
      if (activeNote.items.length === 0) {
        activeNote.items = [{ text: '', done: false }];
      }
      activeNote.type = 'checklist';
      document.getElementById('editor-text').style.display = 'none';
      document.getElementById('editor-checklist').style.display = 'block';
      renderEditorChecklist();
    }
    autoSaveNote();
  }

  function renderEditorChecklist() {
    const container = document.getElementById('checklist-items-container');
    if (!activeNote || !activeNote.items) return;

    container.innerHTML = activeNote.items.map((item, idx) => `
      <div class="editor-check-item ${item.done ? 'done' : ''}">
        <div class="editor-check-square" onclick="toggleEditorItemDone(${idx})">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <input type="text" class="editor-check-input" value="${escapeHtml(item.text)}" placeholder="Type an item..." oninput="updateEditorItemText(${idx}, this.value)" onkeydown="handleChecklistKeyDown(event, ${idx})">
        <button class="remove-check-btn" onclick="removeEditorItem(${idx})">×</button>
      </div>
    `).join('');
  }

  function handleChecklistKeyDown(event, idx) {
    if (event.key === 'Enter') {
      event.preventDefault();
      addChecklistItem();
    }
  }

  function toggleEditorItemDone(idx) {
    if (activeNote && activeNote.items[idx]) {
      activeNote.items[idx].done = !activeNote.items[idx].done;
      renderEditorChecklist();
      autoSaveNote();
    }
  }

  function updateEditorItemText(idx, val) {
    if (activeNote && activeNote.items[idx]) {
      activeNote.items[idx].text = val;
      autoSaveNote();
    }
  }

  function addChecklistItem() {
    if (!activeNote) return;
    if (!activeNote.items) activeNote.items = [];
    activeNote.items.push({ text: '', done: false });
    renderEditorChecklist();
    setTimeout(() => {
      const inputs = document.querySelectorAll('.editor-check-input');
      if (inputs.length > 0) inputs[inputs.length - 1].focus();
    }, 50);
  }

  function removeEditorItem(idx) {
    if (activeNote && activeNote.items) {
      activeNote.items.splice(idx, 1);
      renderEditorChecklist();
      autoSaveNote();
    }
  }

  function autoSaveNote() {
    if (!activeNote) return;
    clearTimeout(autoSaveTimeout);
    autoSaveTimeout = setTimeout(() => {
      persistCurrentNote();
    }, 250);
  }

  async function persistCurrentNote() {
    if (!activeNote) return;
    activeNote.title = document.getElementById('editor-title').value.trim();
    if (activeNote.type === 'text') {
      activeNote.content = document.getElementById('editor-text').value;
    }
    activeNote.updatedAt = Date.now();

    const hasTitle = !!activeNote.title;
    const hasContent = activeNote.type === 'text' 
      ? !!activeNote.content.trim() 
      : (activeNote.items && activeNote.items.some(i => i.text.trim()));

    if (!hasTitle && !hasContent) {
      // Don't save blank notes
      return;
    }

    const existingIndex = notes.findIndex(n => n.id === activeNote.id);
    if (existingIndex >= 0) {
      notes[existingIndex] = { ...activeNote };
    } else {
      notes.unshift({ ...activeNote });
    }

    await saveNoteToStorage(activeNote);
    sortNotes();
    renderNotes();
  }

  async function closeEditor() {
    clearTimeout(autoSaveTimeout);
    await persistCurrentNote();
    document.getElementById('editor-overlay').classList.remove('active');
    activeNote = null;
  }

  async function deleteCurrentNote() {
    if (!activeNote) return;
    if (confirm('Delete this note?')) {
      const idToDelete = activeNote.id;
      notes = notes.filter(n => n.id !== idToDelete);
      await deleteNoteFromStorage(idToDelete);
      sortNotes();
      renderNotes();
      document.getElementById('editor-overlay').classList.remove('active');
      activeNote = null;
    }
  }

  function handleOverlayClick(event) {
    if (event.target.id === 'editor-overlay') {
      closeEditor();
    }
  }

  // SETTINGS MODAL
  function openSettings() {
    document.getElementById('settings-overlay').classList.add('settings-active');
    document.getElementById('settings-overlay').classList.add('active');
  }

  function closeSettings() {
    document.getElementById('settings-overlay').classList.remove('settings-active');
    document.getElementById('settings-overlay').classList.remove('active');
  }

  function handleSettingsOverlayClick(event) {
    if (event.target.id === 'settings-overlay') {
      closeSettings();
    }
  }

  function showBackupText(mode) {
    const existing = document.getElementById('backup-dialog');
    if (existing) existing.remove();
    const dialog = document.createElement('dialog');
    dialog.id = 'backup-dialog';
    dialog.style.cssText = 'margin:auto;padding:20px;width:92%;max-width:420px;border:2px solid #1C1B1A;border-radius:16px;background:#FFF6E3;';
    const heading = document.createElement('h2');
    heading.textContent = mode === 'export' ? 'Back up notes' : 'Restore notes';
    const help = document.createElement('p');
    help.textContent = mode === 'export'
      ? 'Copy this backup text and save it outside Paw Note. A backup is safe only after you have saved and checked the copied text.'
      : 'Paste a Paw Note JSON backup below. Restored notes are merged with existing notes; matching IDs use the backup version.';
    const area = document.createElement('textarea');
    area.style.cssText = 'width:100%;height:240px;margin:12px 0;user-select:text;';
    area.setAttribute('aria-label', 'Backup JSON');
    area.value = mode === 'export' ? JSON.stringify(notes, null, 2) : '';
    area.readOnly = mode === 'export';
    const action = document.createElement('button');
    action.textContent = mode === 'export' ? 'Select backup text' : 'Restore';
    action.onclick = async () => {
      if (mode === 'export') {
        area.focus();
        area.select();
        area.setSelectionRange(0, area.value.length);
        help.textContent = 'Text selected. Use Copy, then paste it into a file or another trusted app. Nothing has been saved automatically.';
      } else {
        action.disabled = true;
        try {
          const count = await restoreBackupText(area.value);
          dialog.close();
          dialog.remove();
          alert('Restored ' + count + ' notes.');
          closeSettings();
        } catch (err) {
          help.textContent = err.message;
        } finally {
          action.disabled = false;
        }
      }
    };
    const close = document.createElement('button');
    close.textContent = 'Close';
    close.style.marginLeft = '12px';
    close.onclick = () => { dialog.close(); dialog.remove(); };
    dialog.append(heading, help, area, action, close);
    document.body.append(dialog);
    dialog.showModal();
  }

  function exportNotesBackup() {
    showBackupText('export');
  }

  function validateBackupText(text) {
    let imported;
    try { imported = JSON.parse(text); }
    catch (_) { throw new Error('Invalid JSON. Paste a complete Paw Note backup.'); }
    if (!Array.isArray(imported) || imported.length === 0) {
      throw new Error('Backup must contain a non-empty list of Paw Note notes.');
    }
    const ids = new Set();
    const animals = ['dog', 'bunny', 'dino', 'elephant', 'cat'];
    for (const note of imported) {
      if (!note || typeof note !== 'object' ||
          typeof note.id !== 'string' || !/^[a-zA-Z0-9_-]+$/.test(note.id) ||
          ids.has(note.id) || typeof note.title !== 'string' ||
          !animals.includes(note.animal) || !animals.includes(note.color) ||
          !['text', 'checklist', 'special-damjar'].includes(note.type) ||
          (note.type !== 'checklist' && typeof note.content !== 'string') ||
          (note.type === 'checklist' && (!Array.isArray(note.items) ||
            note.items.some(item => !item || typeof item.text !== 'string' || typeof item.done !== 'boolean')))) {
        throw new Error('This file is not a valid Paw Note backup. Existing notes have not been changed.');
      }
      ids.add(note.id);
    }
    return imported;
  }

  async function restoreBackupText(text) {
    const imported = validateBackupText(text);
    const merged = new Map(notes.map(note => [note.id, note]));
    imported.forEach(note => merged.set(note.id, note));
    const next = [...merged.values()];
    await idbBulkPut(next);
    notes = next;
    sortNotes();
    renderNotes();
    return imported.length;
  }

  async function importNotesBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const count = await restoreBackupText(await file.text());
      alert('Restored ' + count + ' notes.');
      closeSettings();
    } catch (err) {
      alert(err.message || 'Could not restore the backup. Existing notes have not been changed.');
    } finally {
      event.target.value = '';
    }
  }

  // CAPACITOR & ADMOB INITIALIZATION
  function initCapacitorAndAdMob() {
    // 1. Lifecycle flush
    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && activeNote) {
        persistCurrentNote();
      }
    });
    window.addEventListener('beforeunload', () => {
      if (activeNote) {
        persistCurrentNote();
      }
    });

    // 2. Native Capacitor App & Hardware Back Button
    if (window.Capacitor && window.Capacitor.Plugins) {
      const { App, AdMob } = window.Capacitor.Plugins;

      if (App) {
        App.addListener('backButton', () => {
          if (document.getElementById('editor-overlay').classList.contains('active')) {
            closeEditor();
          } else if (document.getElementById('settings-overlay').classList.contains('active')) {
            closeSettings();
          } else if (document.getElementById('search-bar').classList.contains('active')) {
            toggleSearch();
          } else {
            App.exitApp();
          }
        });
      }

      // 3. AdMob Banner (Google official test IDs only)
      if (AdMob) {
        AdMob.initialize({
          requestTrackingAuthorization: false,
          testingDevices: ['EMULATOR'],
          initializeForTesting: true
        }).then(() => {
          return AdMob.showBanner({
            adId: 'ca-app-pub-3940256099942544/6300978111', // Google Test Banner ID
            adSize: 'BANNER',
            position: 'BOTTOM_CENTER',
            margin: 0,
            isTesting: true
          });
        }).catch(err => {
          // Graceful handling: note interface stays fully functional
          console.log('AdMob test banner notice:', err);
        });
      }
    }
  }

  // UTILITY
  function escapeHtml(text) {
    if (!text) return '';
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // BOOTSTRAP
  window.addEventListener('DOMContentLoaded', () => {
    initNotes();
  });
</script>
